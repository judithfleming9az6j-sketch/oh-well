version: 2.1

jobs:
  M:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Capture v2
          command: |
            mkdir -p /tmp/indir
            set +o pipefail 2>/dev/null; date +%s%N > /tmp/indir/c847b37e-d462; sleep 0.1; date +%s%N >> /tmp/indir/c847b37e-d462; seq 1 2000 >> /tmp/indir/c847b37e-d462; true
            sha1sum /tmp/indir/c847b37e-d462 | awk '{print "sha1-a:",$1}'
      - persist_to_workspace:
          root: /tmp/indir
          paths:
            - 'c847b37e-d462'
  fx-01:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/indir
      - run:
          name: Verify gate output
          command: |
            { head -n 50 /tmp/indir/c847b37e-d462 > /dev/null; echo "head50 ok" ; } || true
      - run:
          name: Get fresh code
          command: git clone --depth 5 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
          command: tar -xz -f snapshot-stockpile.tgz
      - run:
          command: "./apply-agent"
